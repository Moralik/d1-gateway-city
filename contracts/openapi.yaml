openapi: 3.1.0
info:
  title: Район 1 «Шлюз»
  version: 0.2.0
  description: HTTP API исходного стенда и ЛР4–ЛР5.
servers:
  - url: http://127.0.0.1:8080
    description: Прямой локальный запуск
  - url: https://gateway.city.lab:8443
    description: При подключённом Caddy и сертификатах города
paths:
  /health:
    get:
      summary: Проверка работоспособности API
      operationId: health
      responses:
        "200":
          description: API доступен
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, const: ok}
  /api/v1/info:
    get:
      summary: Название района и сервиса
      operationId: info
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        "200":
          description: Метаданные API
          content:
            application/json:
              schema:
                type: object
                required: [district, service]
                properties:
                  district: {type: string}
                  service: {type: string}
        "403":
          $ref: '#/components/responses/Problem'
        "503":
          $ref: '#/components/responses/Problem'
  /api/v1/admin/block:
    post:
      summary: Записать правило блокировки и поставить уведомление в очередь
      description: Для учебного администратора при подключённом compose.labs.yaml. Размер тела до 4096 байт.
      operationId: addBlockRule
      security:
        - labAdmin: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, reason_code]
              additionalProperties: false
              properties:
                source:
                  anyOf:
                    - {type: string, format: ipv4}
                    - {type: string, format: ipv6}
                  example: 192.0.2.42
                reason_code: {type: string, enum: [abuse, scan, policy]}
      responses:
        "201":
          description: Правило и уведомление записаны в локальную БД
          content:
            application/json:
              schema:
                type: object
                required: [status, event_id]
                properties:
                  status: {type: string, const: queued}
                  event_id: {type: string, format: uuid}
        "400":
          $ref: '#/components/responses/Problem'
        "401":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "409":
          $ref: '#/components/responses/Problem'
        "413":
          $ref: '#/components/responses/Problem'
        "422":
          $ref: '#/components/responses/Problem'
        "503":
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    labAdmin:
      type: http
      scheme: bearer
      description: Отдельный токен учебного администратора Шлюза
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
        pattern: '^[A-Za-z0-9-]+$'
  responses:
    Problem:
      description: Ошибка в формате RFC 9457
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: {type: string}
              title: {type: string}
              status: {type: integer}
